<h1>Install</h1>
<p>For Minecraft 26.2 on Fabric. Java 25. Client-side only.</p>
<ol>
<li>Install <a href="https://fabricmc.net/use/">Fabric Loader</a> 0.19.3 or newer.</li>
<li>Install <a href="https://modrinth.com/mod/fabric-api">Fabric API</a>.</li>
<li>Install <a href="https://github.com/IotaBread/VTDownloader/releases/tag/2.6.0">VTDownloader 2.6.0</a>.</li>
<li>Put the jar from <a href="https://github.com/simply-sunny/vtdownloader-ui-refresh/releases">Releases</a> in <code>mods</code>.</li>
</ol>
